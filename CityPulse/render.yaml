# Render.com blueprint — deploys CityPulse from this repo with one click.
# Render builds the Docker image in the cloud (no local Docker needed), gives a
# permanent https://<name>.onrender.com URL, and auto-deploys on every push.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: citypulse
    runtime: docker
    plan: free
    # Free instances sleep after ~15 min idle; first request after a sleep
    # takes ~30-60 s to wake. Health checks keep it awake while anyone watches.
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
